name: Word correction
description: A wrong meaning, reading, level or kanji, or a word to add
labels: [words]
body:
  - type: input
    id: word
    attributes:
      label: Word (in kana)
      placeholder: さくら
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What should change?
      description: The current text and what it should be. A source helps, for example a dictionary link.
    validations:
      required: true
